<app-navbar />

<div class="container mt-4" *ngIf="!isLoading && event" style="max-width: 800px;">

  <div class="card">
    <div class="flex justify-between items-start mb-4">
      <div>
        <h2 style="margin-bottom: 0.5rem;">{{ event.title }}</h2>
        <span
          style="background: var(--light); padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.85rem; font-weight: 500; color: var(--text-muted);">
          {{ event.category }}
        </span>
      </div>
      <div class="text-center" style="background: var(--light); padding: 0.5rem 1rem; border-radius: var(--radius);">
        <div style="font-weight: 700; font-size: 1.25rem; color: var(--primary);">{{ event.date }}</div>
        <div style="font-size: 0.9rem; color: var(--text-muted);">{{ event.time }}</div>
      </div>
    </div>

    <p style="font-size: 1.05rem; line-height: 1.6; color: var(--text-main); margin-bottom: 2rem;">
      {{ event.description }}
    </p>

    <div style="background: var(--light); padding: 1.5rem; border-radius: var(--radius); margin-bottom: 2rem;">
      <h4 style="margin-bottom: 1rem;">Détails pratiques</h4>
      <p style="margin-bottom: 0.5rem;"><strong>📍 Lieu :</strong> {{ event.location }}</p>

      <div class="flex items-center gap-4 mt-4">
        <div>
          <span style="display: block; font-size: 0.85rem; color: var(--text-muted);">Participants</span>
          <strong style="font-size: 1.1rem;">{{ participantsCount }}</strong>
        </div>
      </div>
    </div>

    <!-- Messages d'erreur et de succès -->
    <div *ngIf="errorMessage" style="background: #FEF2F2; border: 1px solid #FECACA; color: var(--danger); padding: 1rem; border-radius: var(--radius); margin-bottom: 1rem;">
      {{ errorMessage }}
    </div>
    <div *ngIf="successMessage" style="background: #F0FDF4; border: 1px solid #BBEF63; color: var(--success); padding: 1rem; border-radius: var(--radius); margin-bottom: 1rem;">
      {{ successMessage }}
    </div>

    <div class="actions flex gap-4">
      <!-- S'inscrire -->
      <button *ngIf="!isRegistered && !isOrganizer" class="btn btn-primary"
        style="flex: 1; min-height: 48px; font-size: 1rem;" (click)="register()">
        S'inscrire à l'événement
      </button>

      <!-- Désinscrire -->
      <button *ngIf="isRegistered && !isOrganizer" class="btn btn-outline"
        style="flex: 1; border-color: var(--danger); color: var(--danger);" (click)="unregister()">
        Se désinscrire
      </button>
    </div>
  </div>

</div>

<div *ngIf="isLoading" style="text-align: center; padding: 2rem;">
  Chargement...
</div>
