<app-navbar />

<div class="container mt-4" style="display: flex; justify-content: center;">
  <div class="card" style="width: 100%; max-width: 600px;">
    <h2 class="text-center mb-4">Créer un événement</h2>

    <form (ngSubmit)="create()">

      <div class="input-group">
        <label>Titre de l'événement</label>
        <input type="text" placeholder="Ex: Concert Rock" [(ngModel)]="event.title" name="title" required />
      </div>

      <div class="input-group">
        <label>Description</label>
        <textarea rows="4" placeholder="Détails de l'événement..." [(ngModel)]="event.description" name="description"
          required></textarea>
      </div>

      <div class="input-group">
        <label>Lieu</label>
        <input type="text" placeholder="Ex: Paris, Salle Pleyel" [(ngModel)]="event.location" name="location"
          required />
      </div>

      <div class="flex gap-4">
        <div class="input-group" style="flex: 1;">
          <label>Date</label>
          <input type="date" [(ngModel)]="event.date" name="date" required />
        </div>
        <div class="input-group" style="flex: 1;">
          <label>Heure</label>
          <input type="time" [(ngModel)]="event.time" name="time" required />
        </div>
      </div>

      <div class="input-group">
        <label>Catégorie</label>
        <input type="text" placeholder="Ex: Musique, Tech, Art" [(ngModel)]="event.category" name="category" required />
      </div>

      <div class="input-group">
        <label>Image de l'événement (optionnel)</label>
        <input type="file" accept="image/*" (change)="onImageSelected($event)" name="image" />
        <small style="color: var(--text-muted);">Formats acceptés: JPG, PNG, GIF (Max 5MB)</small>
        <div *ngIf="imagePreview" style="margin-top: 1rem;">
          <img [src]="imagePreview" style="max-width: 100%; max-height: 200px; border-radius: var(--radius);" />
        </div>
      </div>

      <p class="success" *ngIf="successMessage" style="color: var(--secondary); margin-bottom: 1rem;">{{ successMessage
        }}</p>
      <p class="error" *ngIf="errorMessage" style="color: var(--danger); margin-bottom: 1rem;">{{ errorMessage }}</p>

      <div class="flex justify-between items-center mt-4">
        <button type="button" class="btn btn-outline" routerLink="/dashboard">Annuler</button>
        <button type="submit" class="btn btn-primary">Créer l'événement</button>
      </div>

    </form>
  </div>
</div>
