spring.application.name=apigateway
server.port=8080

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Auth Service Route
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-microservice
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

# Event Service Route
spring.cloud.gateway.routes[1].id=event-service
spring.cloud.gateway.routes[1].uri=lb://event-microservice
spring.cloud.gateway.routes[1].predicates[0]=Path=/event/**

# Notification Service Route
spring.cloud.gateway.routes[2].id=notification-service
spring.cloud.gateway.routes[2].uri=lb://notification-microservice
spring.cloud.gateway.routes[2].predicates[0]=Path=/notifications/**

# Participant Service Route
spring.cloud.gateway.routes[3].id=participant-service
spring.cloud.gateway.routes[3].uri=lb://participant-microservice
spring.cloud.gateway.routes[3].predicates[0]=Path=/participant/**

# Global CORS Configuration
